<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sadhna Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0a0b; --surface:#131315; --raise:#1c1c1f; --raise-2:#242428;
  --bone:#ece6db; --ash:#8a857c; --dim:#57534c; --gild:#c2a05e;
  --good:#7fa76a; --warn:#c98a4b; --sold:#8e6f6f;
  --line:rgba(236,230,219,.12); --line-2:rgba(236,230,219,.06);
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --util:"Archivo","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0; font-family:var(--util); font-size:14px; line-height:1.5;
  background:var(--ink); color:var(--bone); -webkit-font-smoothing:antialiased; overflow:hidden}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gild); outline-offset:2px}
svg{fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}

/* ── sign in ─────────────────────────────── */
.auth{position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:24px;
  background:radial-gradient(120% 80% at 50% 0%, #16151a, var(--ink) 62%);
  transition:opacity .5s var(--ease), visibility .5s}
.auth.gone{opacity:0; visibility:hidden}
.authbox{width:min(380px,100%); text-align:center}
.authbox .brand{font-family:var(--display); font-size:30px; line-height:1.1}
.authbox .brand em{font-style:italic}
.authbox .who{margin:8px 0 0; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim)}
.authbox .card{margin-top:30px; padding:24px 22px; background:var(--surface);
  border:1px solid var(--line-2); border-radius:14px; text-align:left}
.authbox label{display:block; margin-bottom:7px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ash)}
.authbox input{width:100%; padding:12px 13px; background:var(--raise); border:1px solid var(--line);
  border-radius:9px; font-size:14px; margin-bottom:14px}
.authbox input:focus{outline:none; border-color:var(--gild)}
.authbox .fine{margin:16px 0 0; font-size:11.5px; color:var(--dim); line-height:1.55}
.authbox .fine b{color:var(--ash); font-weight:500}
.or{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin:16px 0;
  font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim)}
.or::before,.or::after{content:""; height:1px; background:var(--line-2)}

/* ── shell ───────────────────────────────── */
.portal{position:fixed; inset:0; display:grid; grid-template-columns:236px 1fr}
.side{border-right:1px solid var(--line-2); background:var(--surface); display:grid;
  grid-template-rows:auto 1fr auto; overflow:hidden}
.side .mark{padding:22px 20px 16px; font-family:var(--display); font-size:20px}
.side .mark em{font-style:italic}
.side .mark span{display:block; font-family:var(--util); font-size:9.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--dim); margin-top:5px}
.side nav{padding:6px 10px; display:grid; align-content:start; gap:2px}
.side nav button{display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:9px;
  color:var(--ash); font-size:13.5px; transition:background .18s, color .18s; text-align:left}
.side nav button:hover{background:var(--raise)}
.side nav button[aria-current="page"]{background:var(--raise-2); color:var(--bone)}
.side nav svg{width:18px; height:18px; flex:none}
.side nav .count{margin-left:auto; min-width:19px; height:19px; padding:0 6px; border-radius:10px;
  background:var(--gild); color:#151007; font-size:10px; font-weight:700; display:grid; place-items:center}
.session{padding:14px 16px; border-top:1px solid var(--line-2); font-size:11.5px; color:var(--dim)}
.session b{display:block; color:var(--bone); font-weight:400; font-size:13px}
.session .row2{display:flex; gap:8px; margin-top:10px}
.session .row2 button{flex:1; padding:8px; border:1px solid var(--line); border-radius:8px;
  font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ash)}
.session .row2 button:hover{color:var(--bone); border-color:var(--ash)}

.main{display:grid; grid-template-rows:auto 1fr; min-width:0; min-height:0}
.top{display:flex; align-items:center; gap:14px; padding:16px 22px; border-bottom:1px solid var(--line-2)}
.top h1{margin:0; font-family:var(--display); font-weight:400; font-size:25px; line-height:1.1; flex:1}
.top h1 span{display:block; font-family:var(--util); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--dim); margin-top:4px}
.top .act{padding:10px 17px; border-radius:9px; font-size:12px; font-weight:600; white-space:nowrap}
.top .act.key{background:var(--gild); color:#151007}
.top .act.ghost{border:1px solid var(--line); color:var(--bone)}
.top .act.ghost:hover{border-color:var(--ash)}

.panes{display:grid; grid-template-columns:392px 1fr; min-height:0}
.pane{overflow-y:auto; overscroll-behavior:contain; min-height:0}
.pane.list{border-right:1px solid var(--line-2)}
.panes.single{grid-template-columns:1fr}
.panes.single .pane.detail{display:none}
.detail-inner{max-width:620px; padding-bottom:40px}
.blank{display:grid; place-content:center; justify-items:center; gap:12px; height:100%;
  color:var(--dim); text-align:center; padding:40px}
.blank svg{width:30px; height:30px; opacity:.5}
.blank p{margin:0; font-size:13px; max-width:26ch}

.tabbar{display:none}
.backbtn{display:none}

/* previewing as someone else */
.preview{display:none; align-items:center; gap:12px; padding:9px 22px;
  background:rgba(194,160,94,.12); border-bottom:1px solid rgba(194,160,94,.3);
  font-size:12px; color:var(--gild)}
body.previewing .preview{display:flex}
.preview button{margin-left:auto; padding:5px 12px; border:1px solid rgba(194,160,94,.4);
  border-radius:999px; font-size:10px; letter-spacing:.1em; text-transform:uppercase}
.locked{opacity:.45; pointer-events:none}
.masked{font-style:italic; color:var(--dim)}

/* mail-style enquiry rows */
.mail{display:flex; gap:12px; width:100%; text-align:left; padding:12px 18px;
  border-left:2px solid transparent; transition:background .18s; align-items:flex-start}
.mail:hover{background:var(--surface)}
.mail[aria-current="true"]{background:var(--surface); border-left-color:var(--gild)}
.mail .dot{width:7px; height:7px; border-radius:50%; background:var(--gild); margin-top:19px; flex:none}
.mail .dot.read{background:transparent}
.mail .mthumb{width:44px; height:44px; border-radius:6px; overflow:hidden; flex:none; background:var(--raise); margin-top:2px}
.mail .mthumb img{width:100%; height:100%; object-fit:cover; display:block}
.mail .mbody{flex:1; min-width:0}
.mail .l1{display:flex; align-items:baseline; gap:9px}
.mail .l1 b{font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mail.unread .l1 b{color:var(--bone)} .mail:not(.unread) .l1 b{font-weight:400; color:var(--ash)}
.mail .l1 time{margin-left:auto; flex:none; font-size:10.5px; color:var(--dim)}
.mail .l2{display:flex; gap:7px; align-items:center; margin-top:2px;
  font-size:12px; color:var(--ash); white-space:nowrap; overflow:hidden}
.mail .l2 .mode{flex:none; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--gild);
  border:1px solid rgba(194,160,94,.34); border-radius:4px; padding:1px 5px}
.mail .l3{margin-top:3px; font-size:12px; color:var(--dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.grp{display:flex; gap:10px; align-items:center; padding:14px 18px 7px;
  font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim)}
.grp .mthumb{width:26px; height:26px; border-radius:5px; overflow:hidden}
.grp .mthumb img{width:100%; height:100%; object-fit:cover}
.grp b{color:var(--ash); font-weight:500; letter-spacing:.04em; font-size:12px; text-transform:none}
.grp .n{margin-left:auto; color:var(--dim)}

.code{
  font-family:ui-monospace,Menlo,monospace; font-size:13px; letter-spacing:.08em;
  background:var(--raise); border:1px dashed var(--line); border-radius:6px; padding:4px 9px;
}
.viewpick{display:grid; gap:8px; padding:0 22px 6px}
.vopt{display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--line-2);
  border-radius:10px; text-align:left; transition:border-color .2s, background .2s}
.vopt[aria-pressed="true"]{border-color:rgba(194,160,94,.5); background:rgba(194,160,94,.07)}
.vopt b{display:block; font-size:13.5px; font-weight:500}
.vopt span{display:block; font-size:11.5px; color:var(--dim)}
.vopt .tick{margin-left:auto; width:19px; height:19px; border-radius:50%; border:1px solid var(--line);
  display:grid; place-items:center; font-size:11px; color:#151007; flex:none}
.vopt[aria-pressed="true"] .tick{background:var(--gild); border-color:var(--gild)}

/* ── shared components ───────────────────── */
.chips{display:flex; gap:7px; overflow-x:auto; padding:14px 18px 12px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; padding:7px 13px; border-radius:999px; border:1px solid var(--line);
  font-size:12px; color:var(--ash); white-space:nowrap; transition:all .2s var(--ease)}
.chip[aria-pressed="true"]{background:var(--gild); border-color:var(--gild); color:#151007; font-weight:600}

.tally{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line-2);
  border:1px solid var(--line-2); border-radius:10px; overflow:hidden; margin:16px 18px 4px}
.tally div{background:var(--surface); padding:12px 10px}
.tally b{display:block; font-family:var(--display); font-size:21px; font-weight:400; line-height:1}
.tally span{display:block; margin-top:5px; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}

.card{display:flex; gap:13px; align-items:center; width:100%; text-align:left; padding:11px 18px;
  transition:background .18s; border-left:2px solid transparent}
.card:hover{background:var(--surface)}
.card[aria-current="true"]{background:var(--surface); border-left-color:var(--gild)}
.thumb{width:62px; height:62px; flex:none; border-radius:7px; overflow:hidden; background:var(--raise)}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.thumb.is-sold img{opacity:.34}
.card .meta{flex:1; min-width:0}
.card .t{font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .d{font-size:11.5px; color:var(--dim); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .p{display:flex; align-items:baseline; gap:7px; margin-top:5px; flex-wrap:wrap}
.card .p .now{font-size:13px; font-variant-numeric:tabular-nums}
.card .p .was{font-size:11px; color:var(--dim); text-decoration:line-through}
.card .p .off{font-size:9.5px; letter-spacing:.08em; color:var(--warn);
  border:1px solid rgba(201,138,75,.4); border-radius:4px; padding:1px 4px}
.card .p .quiet{font-size:11.5px; color:var(--dim); font-style:italic}
.pill{flex:none; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  padding:3px 8px; border-radius:999px; border:1px solid; white-space:nowrap}
.pill.available{color:var(--good); border-color:rgba(127,167,106,.4)}
.pill.reserved{color:var(--warn); border-color:rgba(201,138,75,.4)}
.pill.sold{color:var(--sold); border-color:rgba(142,111,111,.45)}
.pill.draft{color:var(--dim); border-color:var(--line)}

.field{padding:0 22px 15px}
.field label{display:block; margin-bottom:7px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ash)}
.field input, .field textarea{width:100%; padding:11px 13px; background:var(--raise);
  border:1px solid var(--line); border-radius:8px; font-size:14px}
.field input:focus, .field textarea:focus{outline:none; border-color:var(--gild)}
.field input::placeholder{color:var(--dim)}
.hint{font-size:11px; color:var(--dim); margin-top:6px}
.three{display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px}
.seg{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; background:var(--raise); padding:4px; border-radius:10px}
.seg button{padding:9px 2px; border-radius:7px; font-size:11.5px; color:var(--ash); transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--raise-2); color:var(--bone); font-weight:600}

.row{display:flex; align-items:center; gap:12px; padding:13px 22px; border-top:1px solid var(--line-2)}
.row .rt{flex:1}
.row .rt b{display:block; font-weight:400; font-size:14px}
.row .rt span{display:block; font-size:11.5px; color:var(--dim); margin-top:2px}
.toggle{width:44px; height:25px; border-radius:13px; background:var(--raise-2); position:relative;
  transition:background .25s var(--ease); flex:none}
.toggle::after{content:""; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%;
  background:var(--ash); transition:transform .25s var(--ease), background .25s}
.toggle[aria-pressed="true"]{background:rgba(194,160,94,.32)}
.toggle[aria-pressed="true"]::after{transform:translateX(19px); background:var(--gild)}
.stepper{display:flex; align-items:center; gap:2px; background:var(--raise); border-radius:9px; padding:3px}
.stepper button{width:32px; height:30px; border-radius:6px; color:var(--ash); font-size:17px; line-height:1}
.stepper button:hover{background:var(--raise-2); color:var(--bone)}
.stepper b{min-width:44px; text-align:center; font-size:13px; font-weight:500; font-variant-numeric:tabular-nums}

.hero{margin:20px 22px 16px; border-radius:12px; overflow:hidden; background:var(--raise); position:relative}
.hero img{width:100%; display:block; aspect-ratio:4/3; object-fit:cover}
.hero .stamp{position:absolute; inset:0; display:grid; place-items:center; background:rgba(8,8,9,.62);
  font-family:var(--display); font-size:32px; letter-spacing:.12em}
.shots{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; padding:0 22px 15px}
.shot{aspect-ratio:1; border-radius:9px; background:var(--raise); border:1px dashed var(--line);
  display:grid; place-items:center; color:var(--dim); overflow:hidden; position:relative}
.shot img{width:100%; height:100%; object-fit:cover}
.shot svg{width:20px; height:20px}
.shot .x{position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%;
  background:rgba(8,8,9,.8); color:var(--bone); font-size:13px; display:grid; place-items:center}

.actions{padding:14px 22px 24px; display:flex; gap:9px; flex-wrap:wrap}
.btn{flex:1; min-width:150px; height:44px; border-radius:10px; display:grid; place-items:center;
  font-size:12.5px; font-weight:600; letter-spacing:.04em}
.btn.primary{background:var(--gild); color:#151007}
.btn.ghost{border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ash)}
.btn.danger{color:#c8776c; border:1px solid rgba(200,119,108,.3)}

.enq{padding:13px 18px; display:flex; gap:12px; width:100%; text-align:left; transition:background .18s;
  border-left:2px solid transparent}
.enq:hover{background:var(--surface)}
.enq[aria-current="true"]{background:var(--surface); border-left-color:var(--gild)}
.enq .dot{width:7px; height:7px; border-radius:50%; background:var(--gild); margin-top:7px; flex:none}
.enq .dot.read{background:transparent}
.enq .who{font-size:14px}
.enq .about{font-size:12px; color:var(--ash); margin-top:3px}
.enq .when{font-size:11px; color:var(--dim); margin-top:5px}
.enq .mode{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--gild);
  border:1px solid rgba(194,160,94,.34); border-radius:4px; padding:2px 6px; margin-left:7px}

.sect{padding:20px 22px 8px; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim)}
.note{margin:0 22px 14px; padding:14px 15px; border:1px solid var(--line-2); border-radius:10px;
  background:var(--surface); font-size:12.5px; color:var(--ash); line-height:1.6}
.note b{color:var(--bone); font-weight:500}
.note ul{margin:8px 0 0; padding-left:17px}
.note li{margin:4px 0}
.empty{padding:60px 30px; text-align:center; color:var(--dim)}

.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,12px); z-index:80;
  background:var(--raise-2); border:1px solid var(--line); border-radius:11px; padding:12px 18px;
  font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.6); opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease), transform .3s var(--ease)}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ── mobile ──────────────────────────────── */
@media (max-width:900px){
  .portal{grid-template-columns:1fr; grid-template-rows:auto 1fr auto}
  .side{display:none}
  .main{grid-row:2; min-height:0}
  .top{padding:14px 16px calc(14px + env(safe-area-inset-top))}
  .top h1{font-size:21px}
  .panes{grid-template-columns:1fr}
  .pane.detail{display:none}
  body.detail-open .pane.list{display:none}
  body.detail-open .pane.detail{display:block}
  .pane.list{border-right:0}
  .backbtn{display:grid; place-items:center; width:36px; height:36px; border-radius:50%;
    color:var(--ash); flex:none}
  .backbtn svg{width:19px; height:19px}
  body:not(.detail-open) .backbtn{display:none}
  body.detail-open .top .act{display:none}
  .toast{bottom:84px}
  .tabbar{display:grid; grid-template-columns:repeat(4,1fr); grid-row:3;
    border-top:1px solid var(--line-2); background:var(--surface);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{display:grid; justify-items:center; gap:4px; padding:8px 0 9px; color:var(--dim); position:relative}
  .tabbar button[aria-current="page"]{color:var(--gild)}
  .tabbar svg{width:21px; height:21px}
  .tabbar span{font-size:10px; letter-spacing:.06em}
  .tabbar .count{position:absolute; top:4px; right:calc(50% - 18px); min-width:15px; height:15px;
    border-radius:8px; background:var(--gild); color:#151007; font-size:9px; font-weight:700;
    display:grid; place-items:center; padding:0 4px}
  .field, .row, .sect, .actions{padding-left:16px; padding-right:16px}
  .note, .hero{margin-left:16px; margin-right:16px}
  .shots{grid-template-columns:repeat(3,1fr); padding-left:16px; padding-right:16px}
  .detail-inner{max-width:none}
  .btn{min-width:0; flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="auth" id="auth">
  <div class="authbox">
    <div class="brand">Sadhna<em>'s</em> art</div>
    <p class="who">Studio access</p>
    <div class="card">
      <label for="who">Email</label>
      <input id="who" type="email" value="sadhna@sadhnasart.com" autocomplete="username">
      <button class="btn primary" style="width:100%" id="signPasskey">Sign in with a passkey</button>
      <div class="or">or</div>
      <button class="btn ghost" style="width:100%" id="signLink">Email me a sign-in link</button>
      <p class="fine"><b>Only Sadhna can get in here.</b> There's no public link to this page, no
        password to guess, and the sign-in is tied to her own device. A link expires in ten minutes
        and works once.</p>
    </div>
  </div>
</div>

<div class="portal" id="portal" hidden>
  <aside class="side">
    <div class="mark">Sadhna<em>'s</em> art<span>Studio</span></div>
    <nav id="sideNav">
      <button data-tab="works" aria-current="page">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 14l4.5-4.5 4 4L15 10l6 5.5"/></svg>
        Works</button>
      <button data-tab="enquiries">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3z"/></svg>
        Enquiries<i class="count" id="sideCount" hidden></i></button>
      <button data-tab="offers">
        <svg viewBox="0 0 24 24"><path d="M4 12l8-8 8 8-8 8z"/><circle cx="12" cy="12" r="1.6"/></svg>
        Offers</button>
      <button data-tab="studio">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.6M12 18.4V21M3 12h2.6M18.4 12H21M5.6 5.6l1.9 1.9M16.5 16.5l1.9 1.9M18.4 5.6l-1.9 1.9M7.5 16.5l-1.9 1.9"/></svg>
        Studio</button>
    </nav>
    <div class="session">
      <b>Sadhna</b>
      Signed in on this device
      <div class="row2">
        <button id="lockNow">Lock</button>
        <button id="signOut">Sign out</button>

/* ══════════════════════════════════════════════════════════
   Sadhna Studio — the artist's own portal for the site.
   Responsive: a two-pane desk view, a stacked one on a phone.
   State is in memory; this is a flow prototype, not a build.
   ══════════════════════════════════════════════════════════ */

let tab="works", sel=null, filter="all", grouping="latest", pending=3, draft=null;

const inr=n=>"₹"+n.toLocaleString("en-IN");
const net=w=>Math.round(w.price*(1-w.discount/100));
const workById=id=>WORKS.find(w=>w.id===id);
const $=id=>document.getElementById(id);
const el=h=>{const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild;};
const ICON={
  share:'<svg viewBox="0 0 24 24"><path d="M12 15V4M8.5 7.5L12 4l3.5 3.5"/><path d="M5 13v6h14v-6"/></svg>',
  pic:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 14l4.5-4.5 4 4L15 10l6 5.5"/></svg>'
};
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2400);
}

/* ── sign in ── */
function signIn(how){
  $("auth").classList.add("gone");
  $("portal").hidden=false;
  setTimeout(()=>{ $("auth").style.display="none"; render(); },420);
  toast(how==="passkey" ? "Signed in with your passkey" : "Signed in from the emailed link");
}
$("signPasskey").onclick=()=>signIn("passkey");
$("signLink").onclick=()=>{
  toast("Link sent to "+$("who").value+" — expires in 10 minutes");
  setTimeout(()=>signIn("link"),1400);
};
function lock(){
  $("auth").style.display=""; $("portal").hidden=true;
  requestAnimationFrame(()=>$("auth").classList.remove("gone"));
  sel=null; document.body.classList.remove("detail-open");
}
$("lockNow").onclick=lock;
$("exitPreview").onclick=()=>{
  acting=MEMBERS[0]; document.body.classList.remove("previewing");
  tab="studio"; sel=null; render();
};
$("signOut").onclick=()=>{ lock(); toast("Signed out everywhere"); };

/* ── lists ── */
function listWorks(){
  const pane=$("listPane"); pane.innerHTML="";
  const c={
    available:WORKS.filter(w=>w.status==="available").length,
    reserved:WORKS.filter(w=>w.status==="reserved").length,
    sold:WORKS.filter(w=>w.status==="sold").length
  };
  pane.appendChild(el(`<div class="tally">
    <div><b>${c.available}</b><span>Available</span></div>
    <div><b>${c.reserved}</b><span>Reserved</span></div>
    <div><b>${c.sold}</b><span>Sold</span></div></div>`));

  const chips=el(`<div class="chips"></div>`);
  [["all","All"],["available","Available"],["reserved","Reserved"],["sold","Sold"],["draft","Draft"]]
    .forEach(([k,label])=>{
      const c=el(`<button class="chip" aria-pressed="${filter===k}">${label}</button>`);
      c.onclick=()=>{filter=k; render();};
      chips.appendChild(c);
    });
  pane.appendChild(chips);

  const list=WORKS.filter(w=>filter==="all"||w.status===filter);
  if(!list.length) pane.appendChild(el(`<div class="empty">Nothing in this view.</div>`));
  list.forEach(w=>{
    const price = w.status==="sold" ? `<span class="quiet">Sold${w.showPrice?" · "+inr(net(w)):""}</span>`
      : !w.showPrice ? `<span class="quiet">Price on request</span>`
      : w.discount ? `<span class="now">${inr(net(w))}</span><span class="was">${inr(w.price)}</span><span class="off">${w.discount}% off</span>`
      : `<span class="now">${inr(w.price)}</span>`;
    const card=el(`<button class="card" aria-current="${sel?.type==="work"&&sel.id===w.id}">
      <span class="thumb ${w.status==="sold"?"is-sold":""}"><img src="${w.img}" alt=""></span>
      <span class="meta"><span class="t">${w.title}</span>
        <span class="d">${w.medium} · ${w.w} × ${w.h} cm · ${w.year}</span>
        <span class="p">${price}</span></span>
      <span style="display:grid; gap:5px; justify-items:end">
        <span class="pill ${w.status}">${w.status}</span>

function listEnq(){
  const pane=$("listPane"); pane.innerHTML="";
  const chips=el(`<div class="chips"></div>`);
  [["latest","Latest"],["work","By artwork"],["person","By person"]].forEach(([k,label])=>{
    const c=el(`<button class="chip" aria-pressed="${grouping===k}">${label}</button>`);
    c.onclick=()=>{grouping=k; render();};
    chips.appendChild(c);
  });
  pane.appendChild(chips);
  if(!ENQ.length){ pane.appendChild(el(`<div class="empty">No enquiries yet.</div>`)); return; }

  if(grouping==="latest"){
    ENQ.forEach(e=>pane.appendChild(mailRow(e)));
    return;
  }
  if(grouping==="work"){
    const ids=[...new Set(ENQ.map(e=>e.workId))];
    ids.forEach(id=>{
      const w=workById(id), rows=ENQ.filter(e=>e.workId===id);
      pane.appendChild(el(`<div class="grp">
        <span class="mthumb">${w?`<img src="${w.img}" alt="">`:""}</span>
        <b>${w?w.title:"General"}</b><span class="n">${rows.length}</span></div>`));
      rows.forEach(e=>pane.appendChild(mailRow(e,false)));
    });
    return;
  }
  const names=[...new Set(ENQ.map(e=>e.name))];
  names.forEach(n=>{
    const rows=ENQ.filter(e=>e.name===n);
    pane.appendChild(el(`<div class="grp"><b>${n}</b><span class="n">${rows.length} enquir${rows.length>1?"ies":"y"}</span></div>`));
    rows.forEach(e=>pane.appendChild(mailRow(e,true)));
  });
}

    m.onclick =()=>{ w.discount=Math.max(5,w.discount-5); pending++; render(); };
    pl.onclick=()=>{ w.discount=Math.min(60,w.discount+5); pending++; render(); };

  ["title","medium","w","h","y","price"].forEach(k=>{

      const v=e.target.value;

      </div></div>`));
    b.appendChild(el(`<div class="field"><label>Applies to</label>
      <div class="chips" style="padding:0" id="c-scope">
        <button class="chip" data-s="0" aria-pressed="true">All works</button>

      </div></div>`));
    b.appendChild(el(`<div class="field"><label>How many times it can be used</label>
      <div class="chips" style="padding:0" id="c-uses">
        <button class="chip" data-u="1" aria-pressed="true">Once</button>
        <button class="chip" data-u="5" aria-pressed="false">5 times</button>
        <button class="chip" data-u="0" aria-pressed="false">No limit</button>
      </div></div>`));
    const mk=el(`<div class="actions" style="padding-top:0"><button class="btn primary">Create code</button></div>`);
    let kind="pct", scope=0, uses=1;
    b.querySelector("#c-gen").onclick=()=>{
      const words=["MONSOON","STUDIO","GALLERY","FIRST","SEASON","PATRON"];
      $("c-code").value=words[Math.floor(Math.random()*words.length)]+Math.floor(10+Math.random()*89);
    };
    b.querySelectorAll("#c-kind button").forEach(x=>x.onclick=()=>{
      kind=x.dataset.k;
      b.querySelectorAll("#c-kind button").forEach(y=>y.setAttribute("aria-pressed",y===x)); });
    b.querySelectorAll("#c-scope .chip").forEach(x=>x.onclick=()=>{
      scope=+x.dataset.s;
      b.querySelectorAll("#c-scope .chip").forEach(y=>y.setAttribute("aria-pressed",y===x)); });
    b.querySelectorAll("#c-uses .chip").forEach(x=>x.onclick=()=>{
      uses=+x.dataset.u;
      b.querySelectorAll("#c-uses .chip").forEach(y=>y.setAttribute("aria-pressed",y===x)); });
    mk.querySelector("button").onclick=()=>{
      const code=($("c-code").value||"").trim().toUpperCase();
      const val=+$("c-val").value||0;
      if(!code||!val) return toast("A code needs a name and a value.");
      const days=+$("c-until").value||30;
      const until=new Date(Date.now()+days*864e5).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
      COUPONS.unshift({id:++couponId, code, kind, val, scope, until, uses, used:0, active:true});
      pending++; render(); toast(`${code} created — valid till ${until}`);
    };
    b.appendChild(mk);
  }

  b.appendChild(el(`<div class="sect">Live codes</div>`));
  COUPONS.forEach(c=>{
    const w=c.scope?workById(c.scope):null;
    const expired=!c.active || (c.uses>0 && c.used>=c.uses);
    const row=el(`<div class="row">
      <div class="rt">
        <b><span class="code">${c.code}</span>&nbsp; ${c.kind==="pct"?c.val+"% off":inr(c.val)+" off"}</b>
        <span>${w?("Only "+w.title):"Any work"} · till ${c.until} ·
          ${c.uses?`${c.used}/${c.uses} used`:`${c.used} used, no limit`}
          ${expired?" · <em>inactive</em>":""}</span>
      </div>
      ${can("coupons")?`<button class="chip" data-a="copy">Copy</button>
      <button class="chip" data-a="tgl">${c.active?"Pause":"Resume"}</button>
      <button class="chip" data-a="del" style="color:#c8776c">Delete</button>`:""}
    </div>`);
    if(can("coupons")){
      row.querySelector('[data-a="copy"]').onclick=()=>{ navigator.clipboard?.writeText(c.code); toast(c.code+" copied"); };
      row.querySelector('[data-a="tgl"]').onclick=()=>{ c.active=!c.active; pending++; render(); };
      row.querySelector('[data-a="del"]').onclick=()=>{ COUPONS.splice(COUPONS.indexOf(c),1); pending++; render(); };
    }
    b.appendChild(row);
  });
}

        <span>${m.email} · ${m.role}</span></div>
        ${m.role!=="owner"?`<button class="chip" data-a="preview">Preview as</button>`:""}</div>`);
      if(m.role!=="owner") head.querySelector('[data-a="preview"]').onclick=()=>{
        acting=m; document.body.classList.add("previewing");
        $("previewLabel").textContent=`Previewing as ${m.name} — ${m.role}. What you see is what they get.`;
        tab="works"; sel=null; render();
      };
      b.appendChild(head);
      if(m.role!=="owner"){
        CAPS.forEach(([k,label])=>{
          const r=el(`<div class="row" style="padding-top:8px; padding-bottom:8px; border-top:0">
            <div class="rt"><span style="font-size:12.5px; color:var(--ash)">${label}</span></div>
            <button class="toggle" aria-pressed="${!!m.caps[k]}" style="transform:scale(.85)"></button></div>`);
          r.querySelector(".toggle").onclick=()=>{ m.caps[k]=m.caps[k]?0:1; render(); };
          b.appendChild(r);
        });
      }
    });
    const inv=el(`<div class="actions"><button class="btn ghost">Invite someone by email</button></div>`);
    inv.querySelector("button").onclick=()=>toast("Invitation flow — they'd get a passkey setup link");
    b.appendChild(inv);
  }

  b.appendChild(el(`<div class="sect">Access and security</div>`));
  b.appendChild(el(`<div class="note">
    <b>How this stays locked down</b>
    <ul>
      <li>Sign in with a passkey — your face or fingerprint on your own device. Nothing to type, nothing to steal.</li>
      <li>Backup route is a one-time email link that expires in ten minutes.</li>
      <li>This page isn't linked from the public site and asks search engines not to index it.</li>
      <li>You're signed out automatically after 30 minutes of not using it.</li>
      <li>Every price change and status change is logged with the date.</li>
      <li>Buyers' names and numbers are only visible while you're signed in.</li>
    </ul></div>`));
  const devices=el(`<div class="note"><b>Signed in on</b><br>
    This device — Hyderabad, just now<br>
    <span style="color:var(--dim)">iPhone — Hyderabad, 2 days ago</span></div>`);
  b.appendChild(devices);
  const sec=el(`<div class="actions" style="padding-top:0">
    <button class="btn ghost" id="revoke">Sign out of other devices</button>
    <button class="btn ghost" id="addkey">Add another passkey</button></div>`);
  sec.querySelector("#revoke").onclick=()=>toast("Other devices signed out");
  sec.querySelector("#addkey").onclick=()=>toast("Follow the prompt on your device");
  b.appendChild(sec);
}

/* ── navigation ── */
function open_(s){ sel=s; document.body.classList.add("detail-open"); render(); }
function close_(){ sel=null; document.body.classList.remove("detail-open"); render(); }
$("back").onclick=close_;

document.querySelectorAll("#sideNav button, #tabbar button").forEach(btn=>{
  btn.onclick=()=>{ tab=btn.dataset.tab; sel=null; draft=null;
    document.body.classList.remove("detail-open");
    $("listPane").scrollTop=0; render(); };
});
$("addWork").onclick=()=>{
  tab="works";
  draft={title:"", medium:"", w:0, h:0, year:new Date().getFullYear(), price:0, shots:[]};
  open_({type:"add"});
};
$("publish").onclick=()=>{
  if(!pending) return toast("Everything is already live.");
  toast(`${pending} change${pending>1?"s":""} published to sadhnasart.com`);
  pending=0; render();
};
addEventListener("keydown",e=>{ if(e.key==="Escape" && sel) close_(); });
addEventListener("resize",()=>render());

/* ── render ── */
function render(){
  const titles={works:["Works",`${WORKS.length} pieces`],
                enquiries:["Enquiries",`${ENQ.filter(e=>e.state==="new").length} unread`],
                offers:["Offers",`${COUPONS.filter(c=>c.active).length} live codes`],
                studio:["Studio","sadhnasart.com"]};
  let [t,sub]=titles[tab];
  const narrow=matchMedia("(max-width:900px)").matches;
  if(narrow && sel){
    if(sel.type==="work"){ const w=workById(sel.id); t=w?w.title:t; sub=w?`${w.w} × ${w.h} cm`:""; }
    else if(sel.type==="enq"){ const e=ENQ.find(x=>x.id===sel.id); t=e?e.name:t; sub=e?e.ago:""; }
    else if(sel.type==="add"){ t="New work"; sub="Saved as a draft first"; }
  }
  $("pageTitle").childNodes[0].nodeValue=t;
  $("pageSub").textContent=sub;
  $("addWork").hidden = tab!=="works" || !can("works");
  $("publish").hidden = tab==="studio" || !can("publish");
  $("publish").textContent = pending?`Publish (${pending})`:"Published";

  const panes=$("panes");
  if(tab==="studio"||tab==="offers"){
    panes.classList.add("single");
    (tab==="studio"?studio:offers)();
    $("detailPane").innerHTML="";
  }
  else{
    panes.classList.remove("single");
    if(tab==="works") listWorks(); else listEnq();
    if(sel?.type==="work")      detailWork(sel.id);
    else if(sel?.type==="enq")  detailEnq(sel.id);
    else if(sel?.type==="add")  detailAdd();
    else $("detailPane").replaceChildren(blank(
      tab==="works" ? "Pick a piece to change its price, status or discount."
                    : "Pick an enquiry to read it and reply."));
  }

  const unread=ENQ.filter(e=>e.state==="new").length;
  [$("sideCount"),$("tabCount")].forEach(n=>{ n.hidden=!unread; n.textContent=unread; });
  document.querySelectorAll("#sideNav button, #tabbar button").forEach(btn=>{
    if(btn.dataset.tab===tab) btn.setAttribute("aria-current","page");
    else btn.removeAttribute("aria-current");
  });
}
render();
</script>
</body>
</html>
